name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Advisory for now: the repo predates this workflow and currently has
      # 9 lint errors (7 stale eslint-disable comments naming the uninstalled
      # jsx-a11y plugin, 2 empty catch blocks in PreRoom.tsx) plus 18
      # warnings. Clearing that backlog touches component files that open
      # feature branches are working in, so it wants its own PR. Flip this
      # step to blocking (drop continue-on-error) once that lands.
      - name: ESLint (advisory)
        continue-on-error: true
        run: npx eslint .

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npx vite build
